ido no desenvolvimento, implementação e manutenção de software. Você trabalhará em estreita colaboração com a equipe de desenvolvimento para criar soluções eficientes e eficazes para problemas técnicos. Este papel é ideal para alguém apaixonado por tecnologia, com habilidades básicas de programação e desejo de aprender e crescer na área de desenvolvimento de software.\u003c/p\u003e\n\u003cp\u003e \u003c/p\u003e\n\u003cp\u003e \u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eResponsabilidades:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eEscrever código limpo, eficiente e documentado usando uma ou mais linguagens de programação, como Java, Python, C++, etc.\u003c/li\u003e\n\u003cli\u003eColaborar com a equipe de desenvolvimento para planejar, projetar e implementar novos recursos e funcionalidades.\u003c/li\u003e\n\u003cli\u003eSolucionar problemas e depurar problemas de software, identificando e corrigindo bugs.\u003c/li\u003e\n\u003cli\u003eRealizar testes unitários e de integração para garantir a qualidade do software.\u003c/li\u003e\n\u003cli\u003eParticipar de revisões de código e contribuir para a melhoria contínua do processo de desenvolvimento.\u003c/li\u003e\n\u003cli\u003eManter-se atualizado com as tendências e tecnologias emergentes na área de desenvolvimento de software.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eConhecer e cumprir as regras\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003eEntender os requisitos de Antissuborno e Compliance descritos nos documentos do SGI.\u003c/li\u003e\n\u003cli\u003eAplicar essas regras no dia a dia do trabalho.\u003c/li\u003e\n\u003cli\u003eAtuar de forma íntegra, garantindo que suas ações estejam sempre em conformidade com essas diretrizes.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eComunicar situações suspeitas ou irregulares\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003eInformar sempre que houver suspeita, tentativa ou ocorrência real de violação das políticas de Compliance e Antissuborno.\u003c/li\u003e\n\u003cli\u003eO relato deve ser feito quando houver crença razoável de que a informação é verdadeira, mesmo que não haja certeza absoluta.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSaber como usar o Canal de Denúncias\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003eConhecer os procedimentos para realizar notificações pelo Canal de Denúncias.\u003c/li\u003e\n\u003cli\u003eEstar ciente de seus direitos, proteção contra retaliações e confidencialidade ao fazer um relato.\u003c/li\u003e\n\u003cli\u003eUtilizar o canal sempre que necessário, de forma responsável.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEntender a importância do Compliance no desempenho profissional\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003eReconhecer que o cumprimento das práticas de Compliance também faz parte da avaliação de desempenho individual.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eRequisitos:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eGraduação completa nas áreas de Tecnologia ou áreas correlatas, reconhecido pelo MEC;\u003c/li\u003e\n\u003cli\u003eExperiência em desenvolvimento com Java, Angular, Spring Framework, JPA, modelagem de dados, TDD, testes unitários e testes de integração, metodologias ágeis e construção de produtos são uma vantagem;\u003c/li\u003e\n\u003cli\u003eExperiência nos bancos de dados Postgre e Oracle são uma vantagem;\u003c/li\u003e\n\u003cli\u003eDesejável conhecimento em Microserviços, práticas de Clean Code e análise de código são uma vantagem;\u003c/li\u003e\n\u003cli\u003eExperiência com ferramentas Git, IDEs de Java; Linux, Jenkins, Sonarqube são uma vantagem;\u003c/li\u003e\n\u003cli\u003eInglês Intermediário é uma vantagem.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eCompetências:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eLiderança de equipes;\u003c/li\u003e\n\u003cli\u003eTrabalho em equipe;\u003c/li\u003e\n\u003cli\u003eComunicação;\u0
